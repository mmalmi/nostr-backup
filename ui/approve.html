<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Review Nostr signature</title>
    <link rel="icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="approve.js"></script>
  </head>
  <body>
    <main>
      <h1 id="reviewTitle">Review request</h1>
      <p id="origin"></p>
      <pre id="event"></pre>
      <label class="check" id="rememberOption" hidden><input type="checkbox" id="remember" /> <span id="rememberLabel"></span></label>
      <div class="actions">
        <button id="deny" class="secondary">Decline</button
        ><button id="allow" disabled>Sign event</button>
      </div>
      <p id="notice" role="status"></p>
    </main>
  </body>
</html>
